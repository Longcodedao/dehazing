SCHEDULE:
  - RESOLUTION: 256 
    EPOCHS: 200         # Reduced: Fine-tuning needs fewer epochs than scratch training
    BATCH_SIZE: 8       # Keep consistent
    
SCHEDULER:
    TYPE: Cosine
    WARMUP_EPOCHS: 5    # Reduced: We don't need a long warmup because weights are already stable
    
OPTIM:
    LR: 0.00002         # CRITICAL: 10x smaller than initial training (2e-4 -> 2e-5)
                        # This prevents "Catastrophic Forgetting" of previous knowledge.

LOSS:
    W_FLOW: 1.0
    W_PERC: 0.5         # HIGH: Rely on VGG to find structure in the gray/white fog
    W_PHYS: 0.01        # LOW: Physics equation is unstable in dense haze (t near 0). 
    W_TV: 0.01
    W_ATM: 0.00 
    W_FFT: 0.1          # MEDIUM: Help recover high-frequency edges lost in the haze
    W_CR: 0.2           # HIGH: Aggressively punish looking like the white input
    W_SSIM: 0.5         # HIGH: SSIM is the most stable metric for this dataset
    DENSITY_BOOST: 5.0

TRAIN:
    STEPS_PER_EPOCH: 200
    PATIENCE: 30        # Lower patience: If it stops improving, it's likely done.

EVAL:
    METRIC_EARLY_STOPPING: SSIM