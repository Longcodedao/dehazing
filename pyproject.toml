[project]
name = "dehazing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # Changed to >= to allow Nightly versions (e.g., 2.7.0.dev...)
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "torchaudio>=2.6.0",
  "filelock>=3.13.1",
  "fsspec>=2024.0.0",
  "jinja2>=3.1.0",
  "markupsafe>=2.1.0",
  "mpmath>=1.3.0",
  "networkx>=3.0",
  "numpy>=1.26.0",
  
  # REMOVED EXPLICIT NVIDIA BINARIES 
  # (Let PyTorch Nightly pull the correct CUDA 12.8 dependencies automatically 
  # to avoid version conflicts with the manual 12.4 pins you had)
  
  "pillow>=10.0.0",
  "sympy>=1.12",
  "triton>=3.0.0",
  "typing-extensions>=4.9.0",
  "torchdiffeq>=0.2.5",
  "torchinfo>=1.8.0",
  "torchmetrics>=1.8.2",
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "tqdm>=4.66.0",
  "kaggle>=1.6.0",
  "einops>=0.8.0",
  "jupyter>=1.0.0",
  "yacs>=0.1.8",
  "tensorboard>=2.15.0",
  "thop>=0.1.1.post2209072238",
  "rich>=13.7.0",
]

# --- UV-specific Configuration ---
# WE CHANGED THIS TO NIGHTLY CUDA 12.8
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true 

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]